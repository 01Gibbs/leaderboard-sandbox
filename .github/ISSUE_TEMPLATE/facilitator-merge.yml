name: 'Facilitator: Merge duplicate people'
description: 'Combine two rows for one person.'
title: 'Facilitator: Merge duplicate people'
labels: [facilitator]
body:
  - type: input
    id: keep
    attributes:
      label: 'Row to keep'
      description: 'Its name stays.'
    validations:
      required: true
  - type: input
    id: duplicate
    attributes:
      label: 'Duplicate row'
      description: 'Folded into the row to keep; the higher value of every column is kept.'
