# Pulls pull requests from the exercise repositories into the leaderboard and grades them.
# Participant code runs only in the `grade` job, which has a read-only token and no stored credentials.
# The `publish` job never runs participant code; it merges the results and commits them.
name: 'Grade submissions (automatic every 4 hours)'

on:
  schedule:
    - cron: '0 */4 * * *'  # 00:00, 04:00, 08:00... UTC; GitHub may start it a few minutes late
  workflow_dispatch:
    inputs:
      only:
        description: 'Grade one pull request only, e.g. AtulKumarSharma79/Frameworkupgrade#3'
        required: false

concurrency:
  group: grade
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - name: Create a separate user to run submissions as
        run: sudo useradd --create-home --shell /bin/bash grader-sandbox
      - name: Grade new commits
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          GRADER_SANDBOX_USER: grader-sandbox
          GRADER_CACHE: /tmp/grader-cache  # readable by the sandbox user
        run: python3 grader/leaderboard.py grade ${ONLY:+--only "$ONLY"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}  # keep whatever was graded, even if a later step failed
        with:
          name: results
          path: grader/results.json

  publish:
    needs: grade
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # pushes with the deploy key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ssh-key: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}  # main requires a pull request; only this key may push to it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: results
          path: ${{ runner.temp }}/graded
      - name: Update participants.csv
        run: grader/run_and_push.sh "Update leaderboard from graded submissions" 'cp "$RUNNER_TEMP/graded/results.json" grader/results.json && python3 grader/leaderboard.py apply'
