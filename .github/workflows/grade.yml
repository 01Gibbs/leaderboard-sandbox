# Pulls pull requests from the exercise repositories into the leaderboard and grades them.
# Participant code runs only in the `grade` job, which has a read-only token and no stored credentials.
# The `publish` job never runs participant code; it merges the results and commits them.
#
# It runs when a pull request on an exercise repository is opened, gets a new commit, or is closed or reopened:
# each exercise repository's notify-leaderboard workflow (grader/exercise-repo/notify-leaderboard.yml, set up
# with grader/setup-pr-trigger.sh) sends a `submission` event. Every run grades everything not graded yet,
# so when several events arrive together and GitHub drops the waiting runs but one, nothing is missed. (A run
# started by hand with "only" grades one pull request; anything else waits for the next event or the daily run.)
name: 'Grade submissions (automatic on every pull request)'

on:
  repository_dispatch:
    types: [submission]
  schedule:
    - cron: '17 3 * * *'  # once a day, a backstop for any event missed (a repository without the hook, an expired token)
  workflow_dispatch:
    inputs:
      only:
        description: 'Grade one pull request only, e.g. AtulKumarSharma79/Frameworkupgrade#3'
        required: false

concurrency:
  group: grade
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main  # not the commit the event fired on: a run that waited must see the results saved before it
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - name: Create a separate user to run submissions as
        run: sudo useradd --create-home --shell /bin/bash grader-sandbox
      - name: Say what started this run
        if: github.event_name == 'repository_dispatch'
        env:
          PR: ${{ github.event.client_payload.pr }}
        run: |
          echo "Started because a pull request changed: ${PR:-unknown}" >> "$GITHUB_STEP_SUMMARY"
      - name: Grade new commits
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          GRADER_SANDBOX_USER: grader-sandbox
          GRADER_CACHE: /tmp/grader-cache  # readable by the sandbox user
        run: python3 grader/leaderboard.py grade ${ONLY:+--only "$ONLY"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}  # keep whatever was graded, even if a later step failed
        with:
          name: results
          path: grader/results.json

  publish:
    needs: grade
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # pushes with the deploy key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ssh-key: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}  # main requires a pull request; only this key may push to it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: results
          path: ${{ runner.temp }}/graded
      - name: Update participants.csv
        run: grader/run_and_push.sh "Update leaderboard from graded submissions" 'python3 grader/leaderboard.py apply "$RUNNER_TEMP/graded/results.json"'
