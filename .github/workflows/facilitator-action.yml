# Shared by the "Facilitator: ..." workflows. Runs one leaderboard command and saves it; the push republishes the page.
# Inputs arrive as a JSON array and go straight to Python, so nothing typed in a form is run by a shell.
name: Facilitator action

on:
  workflow_call:
    inputs:
      args:
        required: true
        type: string
    secrets:
      LEADERBOARD_DEPLOY_KEY:
        required: true
    outputs:
      summary:
        description: 'What happened, as shown on the run page (changes-from-issues.yml replies with it)'
        value: ${{ jobs.change.outputs.summary }}

defaults:
  run:
    shell: bash  # with pipefail, so a failed command fails the run

jobs:
  change:
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # pushes with the deploy key
    outputs:
      summary: ${{ steps.change.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ssh-key: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}  # main requires a pull request; only this key may push to it
      - name: Change the leaderboard
        id: change
        env:
          ARGS: ${{ inputs.args }}
        run: |
          status=0
          grader/run_and_push.sh "" 'python3 grader/leaderboard.py --args-json "$ARGS"' || status=$?
          end=$(openssl rand -hex 16)  # a delimiter nothing in the summary can contain
          { echo "summary<<$end"; cat "$GITHUB_STEP_SUMMARY"; echo "$end"; } >> "$GITHUB_OUTPUT"
          exit $status
      - name: Show recent actions
        if: always()
        run: |
          { echo '#### Recent actions (newest first)'; echo '```'; python3 grader/leaderboard.py history 5; echo '```'
            echo 'The public page updates a minute or two after this run finishes.'; } >> "$GITHUB_STEP_SUMMARY"
