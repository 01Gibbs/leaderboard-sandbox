name: 'Facilitator: Add a person'
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Full name'
        required: true
      github:
        description: 'GitHub login, if known (their pull requests then count for this row)'
        required: false
permissions:
  contents: read  # the deploy key, not the token, saves the change
jobs:
  run:
    uses: ./.github/workflows/facilitator-action.yml
    secrets:
      LEADERBOARD_DEPLOY_KEY: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}  # only the key that saves
    with:
      args: '["add", ${{ toJSON(inputs.name) }}, ${{ toJSON(inputs.github) }}]'
