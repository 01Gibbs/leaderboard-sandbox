# Publishes the page. Runs on every push to main, including the grader's and the facilitator forms' saves,
# which push with the LEADERBOARD_DEPLOY_KEY deploy key (pushes made with the default token start no workflows).
# Needs Settings -> Pages -> Source: GitHub Actions.
name: Publish the page

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max  # every push deploys in turn (each publishes the newest main), so no run is ever cancelled
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-again.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main  # the latest scores, even when started by hand from another branch
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Collect only the files the page loads
        run: mkdir _site && cp index.html facilitator.html scoring.js participants.csv lessons.json dashboard.json _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      # GitHub Pages sometimes answers a deploy with a server error (502); try once more before failing the run.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      - name: Wait before trying again
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy-again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
