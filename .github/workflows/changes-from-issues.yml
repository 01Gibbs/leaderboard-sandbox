# Facilitator changes sent as GitHub issues. Only the repository's collaborators get a run at all: an issue from
# anyone else starts nothing (GitHub's author_association says who is a collaborator, and grader/issue_form.py then
# asks for their permission, which must be write, maintain or admin). The facilitator page's Send opens
# .github/ISSUE_TEMPLATE/facilitator-changes.yml already filled in, which becomes `leaderboard.py batch`.
# facilitator-action.yml makes and saves the change. The issue is then answered with what happened, closed and
# locked. Nothing from the issue reaches a shell.
name: 'Facilitator: change from an issue'

on:
  issues:
    types: [opened]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  read:
    # A facilitator form, opened by the owner, an organisation member or a collaborator; anyone else starts nothing.
    if: >-
      startsWith(github.event.issue.title, 'Facilitator: ')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.read.outputs.allowed }}
      args: ${{ steps.read.outputs.args }}
      reply: ${{ steps.read.outputs.reply }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check who sent it, and read the form
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 grader/issue_form.py

  change:
    needs: read
    if: needs.read.outputs.allowed == 'true'
    permissions:
      contents: read  # the deploy key, not the token, saves the change
    uses: ./.github/workflows/facilitator-action.yml
    secrets:
      LEADERBOARD_DEPLOY_KEY: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}  # only the key that saves
    with:
      args: ${{ needs.read.outputs.args }}

  answer:
    needs: [read, change]
    if: always() && needs.read.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # grader/issue_form.py decides the answer
      issues: write  # to comment on, close and lock the issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Answer the issue and close it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          REPLY: ${{ needs.read.outputs.reply }}
          SUMMARY: ${{ needs.change.outputs.summary }}
          OUTCOME: ${{ needs.change.outputs.outcome }}  # changed, refused or broken; empty when not allowed
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # grader/issue_form.py decides the answer: the comment, the close reason (completed only when the change was
          # made) and the lock. Should it fail, the issue is still answered, closed and locked rather than left open.
          if ! decided=$(python3 grader/issue_form.py answer "$RUNNER_TEMP/answer.md"); then
            echo 'Something went wrong before the change could be made. Nothing was changed: tell the repository owner.' > "$RUNNER_TEMP/answer.md"
            decided=$'not planned\nresolved'
          fi
          reason=${decided%%$'\n'*} lock=${decided#*$'\n'}
          gh issue comment "$ISSUE" -R "$REPO" --body-file "$RUNNER_TEMP/answer.md"
          gh issue close "$ISSUE" -R "$REPO" --reason "$reason"
          if [[ $(gh issue view "$ISSUE" -R "$REPO" --json locked -q .locked) != true ]]; then  # a re-run finds it locked
            gh issue lock "$ISSUE" -R "$REPO" --reason "$lock"
          fi
