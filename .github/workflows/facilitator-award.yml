name: 'Facilitator: Award points'
on:
  workflow_dispatch:
    inputs:
      person:
        description: 'Name or GitHub login (as on the leaderboard)'
        required: true
      kind:
        description: 'What for'
        type: choice
        options: [helped, stretch, bonus]
      amount:
        description: 'How many helps / stretch tasks, or bonus points. Use a minus sign to take away.'
        default: '1'
permissions:
  contents: read  # the deploy key, not the token, saves the change
jobs:
  run:
    uses: ./.github/workflows/facilitator-action.yml
    secrets:
      LEADERBOARD_DEPLOY_KEY: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}  # only the key that saves
    with:
      args: '["award", ${{ toJSON(inputs.person) }}, ${{ toJSON(inputs.kind) }}, ${{ toJSON(inputs.amount) }}]'
