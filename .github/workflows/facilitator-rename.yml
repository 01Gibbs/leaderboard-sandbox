name: 'Facilitator: Rename a person'
on:
  workflow_dispatch:
    inputs:
      person:
        description: 'Current name or GitHub login'
        required: true
      new_name:
        description: 'Name to show on the leaderboard'
        required: true
permissions:
  contents: read  # the deploy key, not the token, saves the change
jobs:
  run:
    uses: ./.github/workflows/facilitator-action.yml
    secrets:
      LEADERBOARD_DEPLOY_KEY: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}  # only the key that saves
    with:
      args: '["rename", ${{ toJSON(inputs.person) }}, ${{ toJSON(inputs.new_name) }}]'
