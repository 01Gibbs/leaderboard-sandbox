# Runs the grader's tests: on every pull request (so it can be a required check), and on pushes that change the
# code, lessons or workflows. Two jobs run side by side: the fast tier, and the slow one that builds Java projects,
# runs Docker and simulates every workflow. This is the only place the container check runs end to end.
name: Test the grader

on:
  pull_request:
  push:
    paths: ['grader/**', 'lessons.json', 'dashboard.json', '.github/**', 'walkthrough/**', 'walkthrough.py', 'index.html', 'scoring.js']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0; the parity tests run scoring.js
        with:
          node-version: '22'
      - name: Lint (pyproject.toml)
        run: pipx run ruff==0.14.0 check grader walkthrough.py
      - name: Run the fast tests
        env:
          GRADER_FAST: '1'
        run: python3 -m unittest discover -v grader/tests

  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - name: Create the sandbox user the grader runs submissions as
        run: sudo useradd --create-home --shell /bin/bash grader-sandbox
      - name: Check the sandbox user cannot change the grader
        run: |
          if sudo -n -u grader-sandbox touch grader/rules.py 2>/dev/null; then echo 'grader-sandbox can write to the checkout'; exit 1; fi
      - name: Run the slow tests (check tests run submissions as the sandbox user, like the real grader)
        env:
          GRADER_SANDBOX_USER: grader-sandbox
          GRADER_CACHE: /tmp/grader-cache  # readable by the sandbox user
        run: python3 -m unittest -v grader.tests.test_checks grader.tests.test_workflows
