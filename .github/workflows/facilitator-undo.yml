name: 'Facilitator: Undo last change'
on:
  workflow_dispatch:
permissions:
  contents: read  # the deploy key, not the token, saves the change
jobs:
  run:
    uses: ./.github/workflows/facilitator-action.yml
    secrets:
      LEADERBOARD_DEPLOY_KEY: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}  # only the key that saves
    with:
      args: '["undo"]'
