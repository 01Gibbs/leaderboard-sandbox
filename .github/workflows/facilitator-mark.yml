name: 'Facilitator: Mark an exercise'
on:
  workflow_dispatch:
    inputs:
      person:
        description: 'Name or GitHub login (as on the leaderboard)'
        required: true
      lesson:
        description: 'Exercise key from lessons.json, e.g. container_image'
        required: true
      status:
        description: 'Result'
        type: choice
        options: [correct, submitted, none]
permissions:
  contents: read  # the deploy key, not the token, saves the change
jobs:
  run:
    uses: ./.github/workflows/facilitator-action.yml
    secrets:
      LEADERBOARD_DEPLOY_KEY: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}  # only the key that saves
    with:
      args: '["mark", ${{ toJSON(inputs.person) }}, ${{ toJSON(inputs.lesson) }}, ${{ toJSON(inputs.status) }}]'
