spring.application.name=onboarding-tracker
server.port=8080

# Embedded H2, file based. The location can be overridden with the DB_URL environment variable.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/onboardingdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Logging (replaces log4j.properties)
logging.level.com.example=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5p [%logger{0}] %m%n
